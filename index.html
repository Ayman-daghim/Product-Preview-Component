<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Frontend Mentor | Product preview card component</title>
    </head>
    <body>
        <main class="product-card">
            <picture>
                <source
                    media="(max-width: 700px)"
                    srcset="images/image-product-mobile.jpg"
                />
                <img
                    src="images/image-product-desktop.jpg"
                    alt="Gabrielle Essence Eau De Parfum"
                    class="product-image"
                />
            </picture>

            <section class="product-details">
                <div class="product-category">Perfume</div>
                <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
                <p class="product-description">
                    A floral, solar and voluptuous interpretation composed by
                    Olivier Polge, Perfumer-Creator for the House of CHANEL.
                </p>
                <div class="product-pricing">
                    <span class="current-price">$149.99</span>
                    <span class="old-price">$169.99</span>
                </div>
                <button type="button" class="add-to-cart">
                    <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i> Add to Cart
                </button>
            </section>
        </main>

        <footer class="attribution">
            Challenge by
            <a
                href="https://www.frontendmentor.io?ref=challenge"
                class="attribution-link"
                >Frontend Mentor</a
            >. Coded by
            <a href="https://github.com/Ayman-daghim" class="attribution-link"
                >Ayman Dghim</a
            >.
        </footer>
    </body>
</html>
